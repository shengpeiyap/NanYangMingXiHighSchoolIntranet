<script>

   ========================================================= */
const CFG = {
  school: '南洋鸣溪中学',
  domain: 'intranet.nymx.edu.my',
  key: 'NYMX_SESSION'          // localStorage 里的存档名
};
const EPOCH = new Date(2004, 5, 18, 8, 0, 0);   // 2004-06-18 08:00 系统上线
const SEAT = 4959;                               // 你是第 4959 号访客
const ENC = { ghost: 'R0hPU1RfMDQxMDg=', admin: 'MjEz', cmd: 'T1BFTl9URVJNSU5BTCAtLVVTRVI9MDQxMDggLS1NT0RFPUdIT1NU' };

const DEFAULT = {
  name: null, seat: SEAT, role: 'student',
  sync: 0, integrity: 100,
  exam: [false, false, false], q4: false,
  dumpSeen: false, binSeen: false, clues: [], blogLogin: false, q4wrong: 0, opened: [], chatOpen: false, chatLog: [], chatAsked: [], chatCreep: false, chatCount: {}, invalidEnd: false, repaired: 0, introSeen: false, stage: 1, split: false, dm: [], dmUnread: 0, dmS1: false, s2told: false, dmHello: false, q5: false, q6: false, q7: false, q8: false, q9: false, s2done: false, noteOrder: [], q9pick: -1, fakeDate: 0, fakeSetAt: 0, exitTries: 0, exitLin: false, adminSeen: false, realClock: false, boardSeen: false, terminal: false, ghost: false, demoDone: false, badEnd: false,
  lastSeen: 0, visits: 0
};

/* ========================= 存档 ========================= */
let S, lastRaw, mqText = '';
function readStore() { try { return localStorage.getItem(CFG.key); } catch (e) { return null; } }
function parse(raw) {
  let o = {};
  try { o = JSON.parse(raw || '{}') || {}; } catch (e) { return null; }
  const s = Object.assign({}, DEFAULT, o);
  if (!Array.isArray(s.exam)) s.exam = [false, false, false];
  if (s.name && !s.introSeen) s.introSeen = true;   // 旧存档：已经在里面的人，不再补看开场帖
  for (const k of ['clues', 'opened', 'chatLog', 'chatAsked', 'noteOrder', 'dm']) if (!Array.isArray(s[k])) s[k] = [];
  if (!s.chatCount || typeof s.chatCount !== 'object') s.chatCount = {};
  s.sync = Number(s.sync) || 0;
  s.integrity = Number(s.integrity); if (isNaN(s.integrity)) s.integrity = 100;
  return s;
}
function save() {
  const raw = JSON.stringify(S);
  try { localStorage.setItem(CFG.key, raw); } catch (e) {}
  lastRaw = raw;
}
lastRaw = readStore();
S = parse(lastRaw) || Object.assign({}, DEFAULT);

/* ========================= 工具 ========================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(6, '0');
const daysSince = () => Math.floor((Date.now() - new Date(2004, 5, 18)) / 864e5);
const nowStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${d.toTimeString().slice(0,5)}`; };
const b64 = s => { try { return btoa(s); } catch (e) { return ''; } };
const DEREG = new Date(2004, 5, 18, 23, 42, 0);       // chen_admin 被注销的那一分钟
function sysNow() { return S.fakeDate ? new Date(S.fakeDate + (Date.now() - S.fakeSetAt)) : new Date(); }
const fmtT = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
const beforeDereg = () => sysNow() < DEREG;
function setMq(t) { mqText = t; $('mq').textContent = t; }
const syncLabel = () => S.sync >= 25 ? '记忆同步率' : '考试进度';
function addSync(n) {
  const before = S.sync;
  S.sync = Math.min(99, S.sync + n);
  if (before < 25 && S.sync >= 25) setTimeout(() => {
    setMq('系统提示：“考试进度”已更名为“记忆同步率”。');
    dialog('系统通知', '为配合考场协议，<br>“考试进度”即日起更名为<span class="red">“记忆同步率”</span>。<br><br><span class="small">你浏览过的每一份资料，都已计入。</span>');

/* 对话框排队：一次只显示一个，关掉一个才出下一个 */
const dlgQ = [];
function dlgShow(build) { if (document.querySelector('.dlg-mask')) dlgQ.push(build); else build(); }
function dlgNext() { setTimeout(() => { if (!document.querySelector('.dlg-mask') && dlgQ.length) dlgQ.shift()(); }, 60); }

/* 多按钮对话框：btns = [[文字, 回调], ...] */
function dialog2(title, body, btns) { dlgShow(() => {
  const d = document.createElement('div');
  d.className = 'dlg-mask';
  d.innerHTML = `<div class="dlg"><div class="dlg-t">${title}<span>×</span></div>
    <div class="dlg-b">${body}</div><div class="dlg-f">${btns.map((b, i) => `<button data-i="${i}">${b[0]}</button>`).join(' ')}</div></div>`;
  d.querySelectorAll('.dlg-f button').forEach(el => el.onclick = () => { d.remove(); const f = btns[+el.dataset.i][1]; f && f(); dlgNext(); });
  d.querySelector('.dlg-t span').onclick = () => { d.remove(); const f = btns[btns.length - 1][1]; f && f(); dlgNext(); };
  document.body.appendChild(d);
}); }

function dialog(title, body, cb, btn = '确定') { dlgShow(() => {
  const d = document.createElement('div');
  d.className = 'dlg-mask';
  d.innerHTML = `<div class="dlg"><div class="dlg-t">${title}<span>×</span></div>
    <div class="dlg-b">${body}</div><div class="dlg-f"><button>${btn}</button></div></div>`;
  const close = () => { d.remove(); cb && cb(); dlgNext(); };
  d.querySelector('button').onclick = close;
  d.querySelector('.dlg-t span').onclick = close;
  document.body.appendChild(d);
  d.querySelector('button').focus();
}); }

/* 数据完整性低于 70%：文字开始混入异体字 */
const VAR = { '考':'攷','学':'學','试':'試','生':'甡','的':'旳','你':'祢','我':'莪','是':'昰','有':'冇','人':'亼','在':'扗','了':'孒' };
function corrupt() {
  if (S.integrity >= 70) return;
  const p = S.integrity < 20 ? .55 : S.integrity < 40 ? .35 : .15;
  const w = document.createTreeWalker($('main'), NodeFilter.SHOW_TEXT);
  let n; while ((n = w.nextNode())) {
    if (n.parentNode.closest('input,textarea,.term,.json')) continue;
    n.nodeValue = n.nodeValue.replace(/./g, c => VAR[c] && Math.random() < p ? VAR[c] : c);
  }
}

function calcKey(k) {
  const scr = $('scr');
  if (k === 'C') { calcExpr = ''; $('calc').classList.remove('err'); }
  else if (k === '=') {
    const e = calcExpr.replace(/×/g, '*').replace(/÷/g, '/');
    if (/^0?4108\*213$/.test(e) || /^213\*0?4108$/.test(e) || e === '20040618') {
      calcExpr = ''; $('calc').classList.add('err');
      scr.textContent = 'ERR 0x0004108';
      if (!S.dumpSeen) { S.dumpSeen = true; save(); }
      clue('dump');
      showDump(true); return;
    }
    if (!/^[0-9.+\-*/]+$/.test(e)) { scr.textContent = 'E'; calcExpr = ''; return; }
    try { const r = Function('"use strict";return (' + e + ')')(); calcExpr = isFinite(r) ? String(+r.toFixed(8)) : ''; scr.textContent = calcExpr || 'E'; }
    catch (err) { scr.textContent = 'E'; calcExpr = ''; }
    return;
  } else calcExpr += k;
  scr.textContent = calcExpr || '0';
}

function runTerm(raw) {
  if (suPending) {

    tprint('密码：' + '*'.repeat(Math.min(raw.length, 8)));
    if (b64(raw.trim()) !== ENC.admin) tprint('su: 密码错误。', 'bad');
    else if ((clue('admin'), !beforeDereg())) tprint(`su: 账号 chen_admin 已于 2004-06-18 23:42 注销。（当前系统时间：${fmtT(sysNow())}）`, 'bad');
    else { S.role = 'chen_admin'; save(); tprint('欢迎回来，陈老师。（【管理后台】已开放）', 'ok'); }
    render(); return;
  }
  const line = raw.trim(); if (!line) return;
  tprint('nymx:/srv/exam$ ' + line);
  const [cmd, ...rest] = line.split(/\s+/); const arg = rest.join(' ');
  switch (cmd.toUpperCase()) {
    case 'HELP':
      tprint('HELP            显示本说明\nSTATUS          查看考生状态\nWHOAMI          查看当前身份\nINSPECT <题号>   查看考题的隐藏属性（例：INSPECT q4）\nSET <字段>=<值>  修改会话字段（例：SET role=student）\n                可用身份：student | chen_admin（已注销）| GHOST_xxxxx（底层白名单，系统保留）\nSU <账号>        切换账号（例：SU chen_admin）\nDATE [YYYY-MM-DD HH:MM]  查看或修改系统时间（DATE RESET 可恢复）\nCLEAR           清屏\nEXIT [-f]       离开考场');
      break;

      tprint(`考生 ${S.name} ｜ 座号 ${pad(S.seat)} ｜ 身份 ${S.role} ｜ 同步率 ${S.sync}% ｜ 完整性 ${S.integrity}%`, 'ok'); break;
    case 'WHOAMI':
      tprint(S.ghost ? '04108' : `${pad(S.seat)} 号替考考生（${S.name}）`); break;
    case 'INSPECT':
      if (arg.toLowerCase() !== 'q4') tprint('找不到该题的隐藏属性。', 'bad');
      else if (!S.exam.every(Boolean)) tprint('q4 尚未渲染。请先完成第 1~3 题。', 'bad');
      else tprint('<div id="q4" data-hint="chen_admin 的字条：别拔电源">', 'hl');
      break;
    case 'SET': {
      const m = arg.match(/^(\w+)\s*=\s*(.+)$/);
      if (!m) { tprint('格式：SET 字段=值', 'bad'); break; }
      const k = m[1], v = m[2].trim().replace(/^["']|["']$/g, '');
      if (k === 'role' && v === 'chen_admin') { tprint('拒绝：管理员身份须以 SU 指令登录。', 'bad'); break; }
      if (k === 'role') {
        const r = roleCheck(v);
        if (r.ok) { S.role = v; if (r.ghost) S.ghost = true; tprint(r.msg, 'ok'); }
        else { tprint(r.msg, 'bad'); if (v !== 'chen_admin') hurt(10, '别碰不属于你的东西。'); }
        save();
        if (r.ghost) { setTimeout(() => { location.hash = '#/archive'; }, 1200); }
      } else if (k === 'sync') {
        const n = Number(v);
        if (n >= 100) { S.sync = 100; S.badEnd = true; save(); render(); return; }
        tprint('拒绝：同步率由系统维护，禁止手动修改。', 'bad'); hurt(10, '别碰不属于你的东西。'); save();
      } else if (k === 'integrity') {
        tprint('拒绝：数据完整性只能由系统评估。', 'bad'); hurt(10); save();
      } else tprint('未知字段：' + k, 'bad');
      break;
    }
    case 'CLEAR': termLog = []; break;
    case 'EXIT':
      if (/^(-f|--force|-force)$/i.test(arg)) { forceExit(); return; }
      if (S.role === 'chen_admin') { S.role = 'student'; save(); tprint('已登出 chen_admin。', 'ok'); break; }
      tprint('考场纪律：交卷前严禁离席。', 'bad'); break;
    case 'SU':
      if (arg.toLowerCase() === 'chen_admin') { suPending = true; tprint('su chen_admin'); }
      else if (!arg || arg.toLowerCase() === 'student') { S.role = 'student'; save(); tprint('已切换为 student。', 'ok'); }
      else tprint('su: 用户不存在：' + arg, 'bad');

    case 'DATE': {
      if (!arg) { tprint('当前系统时间：' + fmtT(sysNow()) + (S.fakeDate ? '　（已手动修改）' : '')); break; }
      if (/^reset$/i.test(arg)) { S.fakeDate = 0; save(); tprint('系统时间已恢复：' + fmtT(sysNow()), 'ok'); break; }
      const m = arg.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?$/);
      if (!m) { tprint('格式：DATE YYYY-MM-DD [HH:MM]　或　DATE RESET', 'bad'); break; }
      const d = new Date(+m[1], +m[2] - 1, +m[3], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0);
      if (isNaN(d) || d.getFullYear() < 2004 || d > new Date()) { tprint('拒绝：系统时间超出允许范围（2004-01-01 至今）。', 'bad'); break; }
      S.fakeDate = d.getTime(); S.fakeSetAt = Date.now(); save();
      tprint('系统时间已修改为：' + fmtT(d), 'ok');
      tprint('已挂载该时刻的历史会话快照。账号权限与档案索引，将按此时刻重建。');
      tprint('⚠ 教务处公告：严禁修改系统时间。', 'bad');
      break;
    }
    default: tprint('未知指令：' + cmd + '　（输入 HELP 查看说明）', 'bad');
  }

}

/* 用程序“拍”出来的电脑社合照：不需要会画画 */
function drawPhoto(c) {
  const x = c.getContext('2d'), W = c.width, H = c.height;
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#16181f'); g.addColorStop(1, '#0b0c10');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // 黑板，暗字只有调高曝光才看得见
  x.fillStyle = '#121412'; x.fillRect(130, 22, 220, 86);
  x.fillStyle = '#141614'; x.font = 'bold 22px monospace'; x.textAlign = 'center';
  x.fillText('SAMPLE 0001', 240, 58); x.fillText('/ 5000', 240, 88);
  // 一排亮着的屏幕
  for (let i = 0; i < 6; i++) { x.fillStyle = '#2b3d55'; x.fillRect(20 + i * 78, 250, 56, 38); x.fillStyle = '#5b7fa8'; x.fillRect(24 + i * 78, 254, 48, 30); }
  // 人形剪影
  const people = [[70,190],[140,180],[210,186],[280,178],[350,188],[420,182],[105,215],[245,212],[385,214]];
  people.forEach(([px, py], i) => {
    const smear = i === 3;   // 糊掉的那一个
    for (let k = 0; k < (smear ? 7 : 1); k++) {
      x.globalAlpha = smear ? 0.25 : 1;
      x.fillStyle = smear ? '#5a2026' : `rgb(${40 + i * 3},${42 + i * 3},${50 + i * 3})`;
      const ox = smear ? k * 4 - 12 : 0;
      x.beginPath(); x.arc(px + ox, py - 34, 15, 0, 7); x.fill();
      x.beginPath(); x.ellipse(px + ox, py + 8, 27, 30, 0, Math.PI, 0); x.fill();
      x.fillRect(px + ox - 27, py + 8, 54, 30);
    }
    x.globalAlpha = 1;
  });
  // 噪点（黑板区域不加，调曝光时字才不会被噪点吃掉）
  const img = x.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const px = (i / 4) % W, py = Math.floor(i / 4 / W);
    if (px >= 130 && px < 350 && py >= 22 && py < 108) continue;
    const n = (Math.random() - .5) * 8; d[i] += n; d[i+1] += n; d[i+2] += n;
  }
  x.putImageData(img, 0, 0);
  // 数码相机日期戳
  x.fillStyle = '#ff9a30'; x.font = '15px monospace'; x.textAlign = 'right';
  x.fillText("'04 06 18  22:40", W - 12, H - 10);
  photoBase = x.getImageData(0, 0, W, H);
}
let photoBase = null;
/* 曝光：把最暗的那一段亮度拉开，黑板上的字会在 6 以上清楚浮现 */
function exposePhoto(c, v) {
  const x = c.getContext('2d');
  if (!photoBase) return;
  if (!v) { x.putImageData(photoBase, 0, 0); return; }
  const src = photoBase.data, out = x.createImageData(photoBase.width, photoBase.height), d = out.data;
  const gain = 1 + v * 4, black = 15;
  for (let i = 0; i < src.length; i += 4) {
    for (let k = 0; k < 3; k++) d[i + k] = Math.max(0, Math.min(255, (src[i + k] - black) * gain));
    d[i + 3] = 255;
  }
  x.putImageData(out, 0, 0);
}
function zoomPhoto(c) {

let chatBusy = false, chatTimer = null;
const hhmm = () => new Date().toTimeString().slice(0, 5);
function chatPush(w, t) { S.chatLog.push([w, t, hhmm()]); if (S.chatLog.length > 120) S.chatLog.shift(); save(); refreshChat(); }
function linSay(lines, done) {
  chatBusy = true; refreshChat();
  let i = 0;
  const next = () => {
    if (i >= lines.length) {
      chatBusy = false;
      if (S.sync >= 45 && !S.chatCreep) { S.chatCreep = true; save(); setTimeout(() => linSay(['……', '你打字的节奏，跟我好像。']), 1500); }
      refreshChat(); done && done(); return;
    }
    const t = lines[i++];
    const w = t.startsWith('[') ? 'sys' : 'lin';
    if ($('qtyping')) $('qtyping').textContent = w === 'lin' ? '04108 正在输入……' : '';
    setTimeout(() => { chatPush(w, t); next(); }, 500 + Math.min(1600, t.length * 90));
  };
  next();
}
/* 分层提示：同一个问题问第二、三次，才会说得更明白 */
function topicLines(tp) {
  const L = tp.lines();
  if (typeof L[0] === 'string') return L;
  const n = S.chatCount[tp.id] || 0;
  S.chatCount[tp.id] = n + 1; save();
  return L[Math.min(n, L.length - 1)];
}
const moreTiers = tp => { const L = tp.lines(); return typeof L[0] !== 'string' && (S.chatCount[tp.id] || 0) > 0 && (S.chatCount[tp.id] || 0) < L.length; };
function chatAsk(id) {
  const tp = TOPICS.find(x => x.id === id);
  if (!tp || chatBusy) return;
  chatPush('me', tp.label);
  if (!asked(id)) { S.chatAsked.push(id); save(); }
  linSay(topicLines(tp));
}
function chatFree(text) {
  text = text.trim(); if (!text || chatBusy) return;
  chatPush('me', text);
  const low = text.toLowerCase().replace(/\s/g, '');
  const hit = KEYWORDS.find(([k, id]) => low.includes(k) && TOPICS.find(x => x.id === id && x.cond()));
  if (hit) { if (!asked(hit[1])) { S.chatAsked.push(hit[1]); save(); } linSay(topicLines(TOPICS.find(x => x.id === hit[1]))); }
  else linSay([FILLER[Math.floor(Math.random() * FILLER.length)]]);
}
function chatHtml() {
  return S.chatLog.map(([w, t, tm]) => w === 'sys'
    ? `<div class="qq-sys">${esc(t)}</div>`
    : `<div class="qq-m"><span class="${w === 'me' ? 'qq-me' : 'qq-lin'}">${w === 'me' ? esc(S.name) : '04108'}</span> <span class="small">${tm}</span><br>${esc(t)}</div>`).join('');
}
function refreshChat() {
  const log = $('qlog'); if (!log) return;
  log.innerHTML = chatHtml(); log.scrollTop = log.scrollHeight;
  if (!chatBusy && $('qtyping')) $('qtyping').textContent = '';
  const opts = TOPICS.filter(x => x.cond());
  $('qopts').innerHTML = chatBusy ? '<span class="small">……</span>'
    : (opts.length ? opts.map(x => `<button data-t="${x.id}">${esc(x.label)}${moreTiers(x) ? '（再问一次）' : ''}</button>`).join('') : '<span class="small">（暂时没有想问的。）</span>');
  $('qopts').querySelectorAll('button').forEach(b => b.onclick = () => chatAsk(b.dataset.t));
}

function forceExit() {

  save();
  const n = S.exitTries;
  const o = document.createElement('div'); o.id = 'boot'; document.body.appendChild(o);
  const lines = ['正在强制结束考试会话……', '正在保存考生数据……　完成', '正在关闭 nymx_exam.exe……', '', '',
    'NYMX EXAM SERVER  build 2004.06.18', '正在启动……', `已恢复 1 个未结束的考试会话：${pad(S.seat)}`];

  const step = () => {
    if (i < lines.length) { o.textContent += lines[i++] + '\n'; setTimeout(step, i === 3 ? 1800 : 650); return; }
    setTimeout(() => {
      o.remove(); document.title = `${CFG.school} 校园内联网`; termLog = [];

/* 第 6 题：蜂鸣 + 指示灯（听不到声音也看得到） */
function playBeep() {
  if (beeping) return; beeping = true;
  let ctx = null; try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  const U = 160, seq = [];
  BEEP.split('').forEach((c, ci) => { MORSE[c].split('').forEach((s, si) => { seq.push([s === '.' ? 1 : 3, 1]); }); seq.at(-1)[1] = 3; });
  let t = 0;
  seq.forEach(([on, off]) => {
    const start = t;
    setTimeout(() => { const l = $('lamp'); if (l) l.classList.add('on'); }, start * U);
    setTimeout(() => { const l = $('lamp'); if (l) l.classList.remove('on'); }, (start + on) * U);
    if (ctx) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + start * U / 1000); o.stop(ctx.currentTime + (start + on) * U / 1000); }
    t += on + off;
  });
  setTimeout(() => { beeping = false; }, t * U + 200);
}

function drawNoteFace(c, back) {
  const x = c.getContext('2d'), W = c.width, H = c.height;
  x.fillStyle = '#f1e8c8'; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#d8c99c'; for (let y = 30; y < H; y += 26) { x.beginPath(); x.moveTo(10, y); x.lineTo(W - 10, y); x.stroke(); }
  x.fillStyle = '#2a2a6a'; x.textAlign = 'center';
  if (!back) {
    x.font = 'bold 64px "KaiTi","STKaiti","楷体",serif'; x.fillText('别拔电源', W / 2, 120);
    x.font = '18px "KaiTi","STKaiti",serif'; x.fillText('—— 陈　6/18', W - 80, H - 22);
  } else {
    x.font = 'bold 36px "Courier New",monospace'; x.fillText('06-18 22:41', W / 2, 88);
    x.font = '22px "KaiTi","STKaiti",serif'; x.fillText('去看它在 PC-03 上做什么。', W / 2, 140);
  }
}

    <button class="dm-fab" id="dmfab" title="小美的私信">美${S.dmUnread ? `<span class="dm-badge">${S.dmUnread}</span>` : ''}</button>`;
  $('dmfab').onclick = () => { dmOpen = !dmOpen; if (dmOpen) S.dmUnread = 0; save(); renderDM(); };
  if (dmOpen) {
    const lg = $('dmlog'); lg.scrollTop = lg.scrollHeight;
    $('dmclose').onclick = () => { dmOpen = false; renderDM(); };
    $('dmpost').onclick = e => { e.preventDefault(); showIntro(); };
    el.querySelectorAll('.dm-opts button').forEach(b => b.onclick = () => {
      const x = opts[+b.dataset.o]; dmPush('me', x[2] || x[0]); x[1]();
    });
  }
}


/* ========================= 机密档案 ========================= */

  if (!S.demoDone) { S.demoDone = true; save(); }
  setMq('查无此人。');
  $('main').innerHTML = `
    <div class="notepad"><div class="bar">04108.txt - 记事本</div><div class="menu">文件(F)　编辑(E)　格式(O)　帮助(H)</div>
<pre>========================================

========================================</pre></div>
    <div class="notepad" style="margin-top:12px"><div class="bar">考场名单查询 - nymx_exam.exe</div>
<pre>查询考号：${pad(S.seat)}
查询结果：<b>查无此人。</b>
当前会话：<b>已注销。</b>

考场门锁：已开启</pre></div>
    <p id="afterword" style="text-align:center;margin-top:18px">你从考场里“消失”了。</p>
    <div id="leak"></div>
    <p class="small" style="text-align:center;margin-top:24px">（想重新开始，请清除本站的浏览器数据，或 <a href="#" id="reset">点此重置</a>。）</p>`;

状态：<span class="cn">等待交付</span>${ev ? `

……检测到该考生持有远端连线记录（郑总邮件 ×3、计划任务 ×1）。

      <p style="text-align:center;margin-top:18px"><b>— 第一阶段完成 —</b></p>
      ${S.stage >= 2 ? '<p style="text-align:center"><a href="#/exam">继续补考 →</a></p>' : '<p style="text-align:center"><button id="opendm">查看小美的私信</button></p>'}`;

/* ===================== 数据完整性归零：修复，还是被丢弃？ ===================== */
let collapsing = false;
function collapse() {
  if (collapsing || S.invalidEnd || S.badEnd || !S.name || S.integrity > 0) return;
  collapsing = true;
  dialog2('⚠ 系统警告', `数据完整性：<b class="red">0%</b><br>样本 ${pad(S.seat)} 已无法识别。<br><br>是否执行自动修复？<br>
    <span class="small">修复将以系统内的参考模型，补全缺失的数据。</span>`,
    [['执行修复', repairSelf], ['不修复', () => { S.invalidEnd = true; save(); collapsing = false; render(); }]]);
}
function repairSelf() {
  collapsing = false;
  S.repaired = (S.repaired || 0) + 1; S.integrity = 50; addSync(20); save();
  setMq('修复完成。缺失的部分，已用参考模型 04108 补上。');
  toast(`<span class="red">${syncLabel()} +20%</span>　参考模型：04108`);
  render();
}
function renderInvalid() {
  document.title = '无效样本';
  if ($('invalid')) return;
  const el = document.createElement('div'); el.id = 'invalid';
  const steps = [
    `样本 ${pad(S.seat)}　数据完整性：0%`,
    '判定：<b style="color:#f55">无效样本</b>（不符合合约附件第 7 条）',
    '处理：自考场名单移除，丢弃。',
    `本站访客人数：${pad(S.seat - 1)}`,
    '',
    '门开了。',
    '它不要你了。',
    '',
    '你出来了。'
  ];
  el.innerHTML = `<div class="seq">${steps.map((t, i) => `<div style="animation-delay:${i * 1.1}s">${t || '&nbsp;'}</div>`).join('')}</div>
    <div class="seq" style="margin-top:28px"><div style="animation-delay:${steps.length * 1.1 + .8}s">……你还记得自己的名字吗？<br>
      <input id="ivname" maxlength="10" style="background:#000;color:#ccc;border:1px solid #555;text-align:center;margin-top:8px">
      <div id="ivout" style="min-height:2em;margin-top:8px"></div></div></div>
    <div class="seq"><div style="animation-delay:${steps.length * 1.1 + 2}s;margin-top:20px;font-size:13px;color:#888">— 结局：无效样本 —<br>
      <button id="reset3" style="margin-top:10px">清除记录，重新开始</button></div></div>`;
  document.body.appendChild(el);
  $('reset3').onclick = resetAll;
  $('ivname').onkeydown = e => {
    if (e.key !== 'Enter') return;
    const v = e.target.value.trim(); if (!v) return;
    const g = v.split('').map((c, i) => i % 2 ? '锟' : (VAR[c] || '斤')).join('');
    $('ivout').innerHTML = `你输入的是：<span style="color:#f55">${esc(g)}</span><br><span style="font-size:13px;color:#888">它把你还回来了。只是，没有全部还回来。</span>`;
  };
}

/* 完整性低于 40%：画面偶尔整个反色闪一下 */
setInterval(() => {
  if (!S.name || S.badEnd || S.invalidEnd || S.integrity >= 40) return;
  if (Math.random() < (S.integrity < 20 ? .5 : .25)) {
    document.body.classList.add('flick');
    setTimeout(() => document.body.classList.remove('flick'), 120);
    if (Math.random() < .5) setTimeout(() => { document.body.classList.add('flick'); setTimeout(() => document.body.classList.remove('flick'), 80); }, 220);
  }
}, 4000);

/* ========================= 坏结局 ========================= */
function renderBad() {
  document.title = pad(S.seat);
  let el = $('bad');
  if (!el) { el = document.createElement('div'); el.id = 'bad'; document.body.appendChild(el); }
  const junk = '锟斤拷烫烫烫屯屯▓▒░04108考试未结束' ;
  let s = ''; for (let i = 0; i < 6000; i++) s += junk[Math.floor(Math.random() * junk.length)];
  el.innerHTML = `${s}<div class="msg">恭喜你，意识上传完成。<br><br>你已成为第 ${pad(S.seat)} 号永久档案。<br><br>
    <span style="font-size:14px">考生 ${esc(S.name || '')} 的考试，已经结束了。</span><br><br>
    <button id="reset2">清除记录，重新开始</button></div>`;
  $('reset2').onclick = resetAll;
}
function resetAll() {
  try { localStorage.removeItem(CFG.key); } catch (e) {}
  location.hash = ''; location.reload();
}

/* ======== 让 F12 修改和网页即时联动（每 0.6 秒检查一次存档） ======== */
setInterval(() => {
  const raw = readStore();
  if (raw === lastRaw) return;
  const prev = S, next = parse(raw);
  if (!next) {                         // 存档被改坏
    hurt(10, '数据损坏……别乱碰。'); save(); render(); return;
  }
  lastRaw = raw; S = next;
  if (S.sync >= 100) { S.badEnd = true; save(); render(); return; }
  if (prev.name && S.sync < prev.sync) { S.sync = prev.sync; hurt(10, '别碰不属于你的东西。'); }
  if (S.integrity > prev.integrity) { S.integrity = prev.integrity; setMq('数据完整性只能由系统评估。'); }
  if (S.integrity <= 0 && prev.integrity > 0) setTimeout(collapse, 300);
  if (S.role !== prev.role) {
    const r = roleCheck(S.role);
    if (!r.ok) { S.role = prev.role; setMq(r.msg); }
    else if (r.ghost) { S.ghost = true; setMq(r.msg); setTimeout(() => { location.hash = '#/archive'; }, 1200); }
  }
  if (S.terminal && !prev.terminal) setMq('检测到未授权的调试会话。');
  save(); render();
  const j = $('json'); if (j) { j.classList.remove('flash'); void j.offsetWidth; j.classList.add('flash'); }
}, 600);

/* ========================= 小机关 ========================= */
document.addEventListener('contextmenu', e => {
  e.preventDefault();
  dialog('提示', S.integrity < 70 ? '<span class="red">别碰不属于你的东西。</span>' : '本站禁止右键复制！');
});
document.addEventListener('visibilitychange', () => {
  if (!S.name || S.badEnd) return;
  document.title = document.hidden ? '考生请勿离开座位' : `${CFG.school} 校园内联网`;
});
let peeked = false;
window.addEventListener('resize', () => {
  if (peeked || !S.name || !matchMedia('(pointer:fine)').matches) return;
  if (outerWidth - innerWidth > 200 || outerHeight - innerHeight > 260) {
    peeked = true; setMq(`警告：检测到 ${pad(S.seat)} 号考生正在窥视后台数据。`);
  }
});
console.log('%c' + CFG.school + ' 校园内联网 v2.3', 'font-size:16px;font-weight:bold;color:#0a246a');
console.log('%c如果你能看到这里，说明你也懂这些。所有数据都在 localStorage 的 ' + CFG.key + ' 里。小心别改坏了。—— 04108', 'color:#c00');

/* ========================= 启动 ========================= */
(function init() {
  $('sub').textContent = `Nan Yang Ming Xi High School Intranet v2.3 ｜ ${CFG.domain}`;
  const now = Date.now();
  if (S.name && S.lastSeen && now - S.lastSeen > 30 * 60 * 1000 && !S.badEnd) {
    const hrs = (now - S.lastSeen) / 36e5;
    const gain = Math.min(8, 1 + Math.floor(hrs / 3));
    S.sync = Math.min(95, S.sync + gain);
    setMq(hrs >= 6 ? `你昨晚也有来考试，${S.name} 同学。（${syncLabel()} +${gain}%）`
                   : `欢迎回来，${S.name}。你离开的时候，考试并没有暂停。（${syncLabel()} +${gain}%）`);
  } else if (S.name) {
    setMq(S.demoDone ? '查无此人。'
                     : `欢迎【${S.name}】同学！你已缺考 ${daysSince().toLocaleString()} 天，请立即前往教务处补考。`);
  } else setMq(`欢迎使用${CFG.school}校园内联网！2004 年上学期期末考试已开放作答。`);
  S.lastSeen = now; save();
  setInterval(() => { if (!S.badEnd) { S.lastSeen = Date.now(); save(); } }, 30000);
  render();
  if (S.name && S.integrity <= 0 && !S.invalidEnd) setTimeout(collapse, 1200);   // 旧存档已经归零
})();
</script>
